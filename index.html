<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Web Scanner</title>
    <link rel="stylesheet" href="style.css" />
    <!-- jsPDF Library for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h2>📄 My Web Scanner</h2>

      <div class="video-container">
        <video id="video" autoplay playsinline></video>
      </div>

      <div class="controls">
        <button id="captureBtn">📸 ছবি তুলুন</button>
      </div>

      <!-- তোলা ছবি দেখানোর জায়গা -->
      <div class="canvas-container">
        <canvas id="canvas"></canvas>
      </div>

      <div class="controls" id="actionControls" style="display: none">
        <button id="filterBtn">🎨 স্ক্যানার ফিল্টার দিন</button>
        <button id="pdfBtn">💾 PDF ডাউনলোড করুন</button>
        <button id="retakeBtn">🔄 আবার ছবি তুলুন</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
