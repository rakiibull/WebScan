<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="description"
      content="WebScan - A fast, browser-based document scanner."
    />
    <meta name="theme-color" content="#121212" />

    <title>WebScan Pro</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- jsPDF -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
      defer
    ></script>

    <!-- Cropper.js -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"
    />

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"
      defer
    ></script>

    <!-- OpenCV -->
    <script
      async
      src="https://docs.opencv.org/4.8.0/opencv.js"
      onload="onOpenCvReady()"
      onerror="onOpenCvError()"
    ></script>
  </head>

  <body>
    <div class="app-container">
      <!-- Header -->
      <header>
        <h2>
          <i class="fas fa-file-scanner"></i>
          WebScan
        </h2>

        <span id="pageCount">
          <i class="fas fa-copy"></i>
          Pages: 0
        </span>
      </header>

      <!-- Status -->
      <div
        id="status"
        class="status status-loading"
        role="status"
        aria-live="polite"
      >
        <i class="fas fa-spinner fa-spin"></i>
        <span>AI Scanner Engine Loading...</span>
      </div>

      <!-- Error -->
      <div
        id="errorMessage"
        class="error-message"
        role="alert"
        aria-live="assertive"
        hidden
      >
        <i class="fas fa-circle-exclamation"></i>

        <div>
          <strong id="errorTitle">Something went wrong</strong>
          <p id="errorText"></p>
        </div>

        <button id="dismissErrorBtn" class="icon-btn" type="button">
          <i class="fas fa-xmark"></i>
        </button>
      </div>

      <!-- Camera -->
      <section
        class="camera-section"
        id="cameraSection"
        aria-label="Camera scanner"
      >
        <video
          id="video"
          autoplay
          muted
          playsinline
          aria-label="Camera preview"
        ></video>

        <canvas id="canvas" hidden></canvas>

        <div id="cameraPlaceholder" class="camera-placeholder">
          <i class="fas fa-camera"></i>
          <p>Camera is starting...</p>
        </div>

        <div id="flashEffect" class="flash-effect"></div>
      </section>

      <!-- Crop -->
      <section
        class="crop-section"
        id="cropSection"
        aria-label="Crop document"
        hidden
      >
        <img id="cropImage" src="" alt="Captured document preview" />
      </section>

      <!-- Filter -->
      <section
        class="filter-section"
        id="filterSection"
        aria-label="Document filters"
        hidden
      >
        <div class="filter-preview">
          <canvas id="filterCanvas"></canvas>
        </div>

        <div class="filter-options">
          <button
            class="filter-btn"
            type="button"
            data-filter="original"
          >
            <i class="fas fa-image"></i>
            Original
          </button>

          <button
            class="filter-btn active"
            type="button"
            data-filter="magic"
          >
            <i class="fas fa-wand-magic-sparkles"></i>
            Magic Color
          </button>

          <button
            class="filter-btn"
            type="button"
            data-filter="bw"
          >
            <i class="fas fa-adjust"></i>
            B&W
          </button>
        </div>
      </section>

      <!-- Gallery -->
      <div
        class="gallery-container"
        id="gallery"
        aria-label="Scanned pages"
      ></div>

      <!-- Main controls -->
      <div class="bottom-controls" id="mainControls">
        <button
          id="captureBtn"
          class="primary-btn"
          type="button"
          disabled
        >
          <i class="fas fa-camera"></i>
          <span>স্ক্যান করুন</span>
        </button>

        <button
          id="pdfBtn"
          class="secondary-btn"
          type="button"
          hidden
        >
          <i class="fas fa-file-pdf"></i>
          <span>PDF সেভ করুন</span>
        </button>
      </div>

      <!-- Crop controls -->
      <div
        class="bottom-controls"
        id="cropControls"
        hidden
      >
        <button
          id="cancelCropBtn"
          class="secondary-btn danger-btn"
          type="button"
        >
          <i class="fas fa-xmark"></i>
          বাতিল
        </button>

        <button
          id="applyCropBtn"
          class="primary-btn"
          type="button"
        >
          নেক্সট
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>

      <!-- Filter controls -->
      <div
        class="bottom-controls"
        id="filterControls"
        hidden
      >
        <button
          id="backToCropBtn"
          class="secondary-btn"
          type="button"
        >
          <i class="fas fa-arrow-left"></i>
          ব্যাক
        </button>

        <button
          id="saveFilterBtn"
          class="primary-btn"
          type="button"
        >
          <i class="fas fa-save"></i>
          গ্যালারিতে সেভ
        </button>
      </div>
    </div>

    <!-- PDF Modal -->
    <div
      id="pdfNameModal"
      class="modal-overlay"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="pdfModalTitle"
    >
      <div class="modal-content">
        <button
          id="closePdfModalBtn"
          class="modal-close"
          type="button"
          aria-label="Close"
        >
          <i class="fas fa-xmark"></i>
        </button>

        <h3 id="pdfModalTitle">
          <i class="fas fa-file-signature"></i>
          PDF ফাইলের নাম দিন
        </h3>

        <input
          type="text"
          id="pdfNameInput"
          placeholder="যেমন: My_Document"
          value="WebScan_Document"
          autocomplete="off"
        />

        <div class="modal-buttons">
          <button
            id="cancelPdfBtn"
            class="secondary-btn danger-btn"
            type="button"
          >
            <i class="fas fa-xmark"></i>
            বাতিল
          </button>

          <button
            id="confirmPdfBtn"
            class="primary-btn"
            type="button"
          >
            <i class="fas fa-check"></i>
            সেভ করুন
          </button>
        </div>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
