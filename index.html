<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebScan Pro</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2c3e50" />

    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script
      async
      src="https://docs.opencv.org/4.8.0/opencv.js"
      onload="onOpenCvReady()"
      type="text/javascript"
    ></script>
  </head>
  <body>
    <div class="app-container">
      <header>
        <h2><i class="fas fa-file-scanner"></i> WebScan</h2>
        <span id="pageCount"><i class="fas fa-copy"></i> Pages: 0</span>
      </header>

      <div
        id="status"
        style="
          text-align: center;
          background: #f39c12;
          color: #fff;
          padding: 8px;
          font-size: 13px;
          font-weight: bold;
        "
      >
        <i class="fas fa-spinner fa-spin"></i> AI Scanner Engine Loading...
      </div>

      <!-- ১. ক্যামেরা সেকশন -->
      <div class="camera-section" id="cameraSection">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display: none"></canvas>
        <!-- ফ্ল্যাশ ইফেক্ট -->
        <div id="flashEffect" class="flash-effect"></div>
      </div>

      <!-- ২. ক্রপ সেকশন -->
      <div class="crop-section" id="cropSection" style="display: none">
        <img id="cropImage" src="" alt="Crop Preview" />
      </div>

      <!-- ৩. ফিল্টার সেকশন -->
      <div class="filter-section" id="filterSection" style="display: none">
        <canvas id="filterCanvas"></canvas>
        <div class="filter-options">
          <button class="filter-btn" data-filter="original">
            <i class="fas fa-image"></i> Original
          </button>
          <button class="filter-btn active" data-filter="magic">
            <i class="fas fa-magic"></i> Magic Color
          </button>
          <button class="filter-btn" data-filter="bw">
            <i class="fas fa-adjust"></i> B&W
          </button>
        </div>
      </div>

      <!-- গ্যালারি -->
      <div class="gallery-container" id="gallery"></div>

      <!-- বাটন কন্ট্রোলস -->
      <div class="bottom-controls" id="mainControls">
        <button id="captureBtn" class="primary-btn" disabled>
          <i class="fas fa-camera"></i> স্ক্যান করুন
        </button>
        <button id="pdfBtn" class="secondary-btn" style="display: none">
          <i class="fas fa-file-pdf"></i> PDF সেভ করুন
        </button>
      </div>

      <div class="bottom-controls" id="cropControls" style="display: none">
        <button
          id="cancelCropBtn"
          class="secondary-btn"
          style="background-color: #e74c3c"
        >
          <i class="fas fa-times"></i> বাতিল
        </button>
        <button id="applyCropBtn" class="primary-btn">
          নেক্সট <i class="fas fa-arrow-right"></i>
        </button>
      </div>

      <div class="bottom-controls" id="filterControls" style="display: none">
        <button id="backToCropBtn" class="secondary-btn">
          <i class="fas fa-arrow-left"></i> ব্যাক
        </button>
        <button id="saveFilterBtn" class="primary-btn">
          <i class="fas fa-save"></i> গ্যালারিতে সেভ
        </button>
      </div>
    </div>

    <!-- PDF ফাইলের নাম দেওয়ার পপ-আপ (Modal) -->
    <div id="pdfNameModal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <h3><i class="fas fa-file-signature"></i> PDF ফাইলের নাম দিন</h3>
        <input
          type="text"
          id="pdfNameInput"
          placeholder="যেমন: My_Document"
          value="WebScan_Document"
        />
        <div class="modal-buttons">
          <button
            id="cancelPdfBtn"
            class="secondary-btn"
            style="background-color: #e74c3c"
          >
            <i class="fas fa-times"></i> বাতিল
          </button>
          <button id="confirmPdfBtn" class="primary-btn">
            <i class="fas fa-check"></i> সেভ করুন
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
