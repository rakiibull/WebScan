<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>WebScan - Smart Document Scanner</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- Cropper -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="app">

    <!-- =====================================================
         CAMERA
         ===================================================== -->

    <section
      id="cameraSection"
      class="screen camera-screen"
    >

      <header class="topbar">
        <div>
          <h1>
            <i class="fa-solid fa-scanner-touchscreen"></i>
            WebScan
          </h1>

          <p>Smart Document Scanner</p>
        </div>

        <div
          id="pageCount"
          class="page-count"
        >
          <i class="fa-solid fa-copy"></i>
          Pages: 0
        </div>
      </header>


      <div class="camera-wrapper">

        <video
          id="video"
          autoplay
          playsinline
          muted
        ></video>

        <!-- Real-time scanner overlay -->
        <canvas
          id="scannerOverlay"
          class="scanner-overlay"
        ></canvas>


        <!-- Camera loading -->
        <div
          id="cameraPlaceholder"
          class="camera-placeholder"
        >
          <div class="camera-loader">
            <i class="fa-solid fa-camera"></i>
          </div>

          <p>Starting camera...</p>
        </div>


        <!-- Detection status -->
        <div
          id="detectionStatus"
          class="detection-status"
        >
          <span
            id="detectionDot"
            class="detection-dot"
          ></span>

          <span id="detectionText">
            Looking for document...
          </span>
        </div>


        <!-- Scanner guide -->
        <div class="scanner-guide">

          <div class="guide-corner top-left"></div>
          <div class="guide-corner top-right"></div>
          <div class="guide-corner bottom-left"></div>
          <div class="guide-corner bottom-right"></div>

          <div class="guide-text">
            Place your document inside the frame
          </div>

        </div>

      </div>


      <!-- Status -->
      <div
        id="status"
        class="status"
      ></div>


      <!-- Main controls -->
      <div
        id="mainControls"
        class="controls"
      >

        <button
          id="captureBtn"
          class="capture-button"
          type="button"
          disabled
        >
          <span class="capture-inner"></span>
        </button>

        <button
          id="pdfBtn"
          class="secondary-button"
          type="button"
          hidden
        >
          <i class="fa-solid fa-file-pdf"></i>
          Create PDF
        </button>

      </div>


      <!-- Gallery -->
      <div
        id="gallery"
        class="gallery"
      ></div>

    </section>


    <!-- =====================================================
         CROP
         ===================================================== -->

    <section
      id="cropSection"
      class="screen crop-screen"
      hidden
    >

      <header class="editor-header">

        <button
          id="cancelCropBtn"
          class="icon-button"
          type="button"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

        <h2>Adjust Document</h2>

        <div></div>

      </header>


      <div class="crop-container">

        <img
          id="cropImage"
          alt="Document preview"
        >

      </div>


      <div
        id="cropControls"
        class="editor-controls"
        hidden
      >

        <button
          id="applyCropBtn"
          class="primary-button"
          type="button"
        >
          <i class="fa-solid fa-check"></i>
          Continue
        </button>

      </div>

    </section>


    <!-- =====================================================
         FILTER
         ===================================================== -->

    <section
      id="filterSection"
      class="screen filter-screen"
      hidden
    >

      <header class="editor-header">

        <button
          id="backToCropBtn"
          class="icon-button"
          type="button"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </button>

        <h2>Enhance Scan</h2>

        <div></div>

      </header>


      <div class="filter-preview">

        <canvas
          id="filterCanvas"
        ></canvas>

      </div>


      <div
        id="filterControls"
        class="filter-controls"
        hidden
      >

        <button
          class="filter-btn"
          data-filter="original"
          type="button"
        >
          <span>Original</span>
        </button>

        <button
          class="filter-btn active"
          data-filter="magic"
          type="button"
        >
          <span>Magic Color</span>
        </button>

        <button
          class="filter-btn"
          data-filter="bw"
          type="button"
        >
          <span>B&W</span>
        </button>

        <button
          id="saveFilterBtn"
          class="primary-button"
          type="button"
        >
          <i class="fa-solid fa-check"></i>
          Save Page
        </button>

      </div>

    </section>


    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div
      id="errorMessage"
      class="error-modal"
      hidden
    >

      <div class="error-card">

        <div class="error-icon">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <h3 id="errorTitle">
          Something went wrong
        </h3>

        <p id="errorText"></p>

        <button
          id="dismissErrorBtn"
          class="primary-button"
          type="button"
        >
          OK
        </button>

      </div>

    </div>


    <!-- =====================================================
         PDF MODAL
         ===================================================== -->

    <div
      id="pdfNameModal"
      class="modal-backdrop"
      hidden
    >

      <div class="modal-card">

        <button
          id="closePdfModalBtn"
          class="modal-close"
          type="button"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

        <h3>Save PDF</h3>

        <p>
          Enter a name for your document.
        </p>

        <input
          id="pdfNameInput"
          type="text"
          value="WebScan_Document"
          autocomplete="off"
        >

        <div class="modal-actions">

          <button
            id="cancelPdfBtn"
            class="secondary-button"
            type="button"
          >
            Cancel
          </button>

          <button
            id="confirmPdfBtn"
            class="primary-button"
            type="button"
          >
            <i class="fa-solid fa-file-pdf"></i>
            Save PDF
          </button>

        </div>

      </div>

    </div>


    <!-- Capture flash -->
    <div
      id="flashEffect"
      class="flash-effect"
    ></div>

  </main>


  <!-- OpenCV -->
  <script
    async
    src="https://docs.opencv.org/4.x/opencv.js"
    onload="onOpenCvReady()"
  ></script>


  <!-- Cropper -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"
  ></script>


  <!-- jsPDF -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  ></script>


  <!-- App -->
  <script src="script.js"></script>

</body>
</html>
